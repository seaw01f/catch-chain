name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout .nvmrc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - name: node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # The tarball tested by the ci job is published as-is, so the checks read the version from it rather than from the checkout
      - name: verify release
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tarballs=("$RUNNER_TEMP"/package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one package tarball, found ${#tarballs[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          version="$(tar -xzOf "$tarball" package/package.json | jq -r .version)"

          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$version"
            exit 1
          fi

          if [[ "$version" == *-* ]]; then version_is_prerelease=true; else version_is_prerelease=false; fi
          if [ "$version_is_prerelease" != "$RELEASE_IS_PRERELEASE" ]; then
            echo "::error::Version $version and the release's prerelease flag ($RELEASE_IS_PRERELEASE) disagree"
            exit 1
          fi

          if [ "$version_is_prerelease" = true ]; then dist_tag=next; else dist_tag=latest; fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # npm, not pnpm, performs the publish: the npm trusted publisher is configured for the npm CLI's OIDC exchange
      - name: publish
        env:
          TARBALL: ${{ steps.verify.outputs.tarball }}
          DIST_TAG: ${{ steps.verify.outputs.dist-tag }}
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"
